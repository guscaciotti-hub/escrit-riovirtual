name: Deploy preview (GitHub Pages)

# Publica o client estático (modo offline: mapa + agentes exploráveis).
# Chat 1:1 e reuniões exigem o backend local + ANTHROPIC_API_KEY.

on:
  push:
    branches:
      - claude/virtual-office-ai-agents-euenn9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Build do client (base = subdiretório do Pages)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ''
        run: npm run build -w client

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
